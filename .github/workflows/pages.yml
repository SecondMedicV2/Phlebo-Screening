name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # thyrocarejobs.in/hiringphlebo/ (Google ads, form-first) is the same page as the
      # root (Meta ads, pincode-first); index.html picks the flow from the URL path.
      - name: Build /hiringphlebo/ page
        run: |
          mkdir -p hiringphlebo
          sed 's#https://thyrocarejobs.in/"#https://thyrocarejobs.in/hiringphlebo/"#g' index.html > hiringphlebo/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
